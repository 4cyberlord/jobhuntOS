server {
  listen 443 ssl http2;
  server_name api.example.com;
  # Configure certificate paths with your TLS provider (for example Certbot).
  location / { proxy_pass http://127.0.0.1:8787; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
}
server { listen 80; server_name api.example.com; return 301 https://$host$request_uri; }
